version: '3.8'

# NOTE: This docker-compose is OPTIONAL!
# Quarkus DevServices automatically starts PostgreSQL in dev mode.
# Use this only if you need:
# - Persistent data across restarts
# - External database access (e.g., from other tools)
# - Custom PostgreSQL configuration
# - Production-like setup
#
# For development, simply run: mvn quarkus:dev
# DevServices will handle everything automatically.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qr-generator-db
    environment:
      POSTGRES_DB: ai_rag_service
      POSTGRES_USER: ai_rag_service_user
      POSTGRES_PASSWORD: qr_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - qr-generator-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_rag_service_user -d ai_rag_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment to add pgAdmin for database management
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: qr-generator-pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@example.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   networks:
  #     - qr-generator-network
  #   depends_on:
  #     - postgres

volumes:
  postgres-data:
    driver: local

networks:
  qr-generator-network:
    driver: bridge
