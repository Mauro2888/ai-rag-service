# Datasource
quarkus.datasource.db-kind                             = postgresql
quarkus.datasource.devservices.db-name                 = ai_rag_service
quarkus.datasource.devservices.image-name              = pgvector/pgvector:pg16

# Hibernate
quarkus.hibernate-orm.database.default-schema          = ai_rag_service
quarkus.hibernate-orm.jdbc.timezone                    = UTC

# Flyway
quarkus.flyway.migrate-at-start                        = true
quarkus.flyway.baseline-on-migrate                     = true
quarkus.flyway.schemas                                 = ai_rag_service

# OpenAPI
mp.openapi.scan.packages                               = com.rag.airagservice.inbound,com.rag.airagservice.vm

# Dev profile
%dev.quarkus.log.category."com.rag.airagservice".level = DEBUG
%dev.quarkus.hibernate-orm.log.sql                     = true

# Test profile
%test.quarkus.datasource.db-kind                       = h2
%test.quarkus.datasource.jdbc.url                      = jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation        = drop-and-create
%test.quarkus.flyway.migrate-at-start                  = false


# Ollama
quarkus.langchain4j.ollama.base-url                    = http://localhost:11434

# EMBEDDINGS (changed model)
quarkus.langchain4j.ollama.embedding-model.model-name  = nomic-embed-text
quarkus.langchain4j.ollama.embedding-model.enabled     = true

# PgVector
quarkus.langchain4j.pgvector.dimension                 = 768
quarkus.langchain4j.pgvector.table                     = embeddings
quarkus.langchain4j.pgvector.use-index                 = true
quarkus.langchain4j.pgvector.index-list-size           = 10


quarkus.langchain4j.log-requests                       = true
quarkus.langchain4j.ollama.timeout                     = 120s